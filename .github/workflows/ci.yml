name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Node's supported lines on the three desktop/server OSes. The corpus tests
    # read ../lm15-contract at CONTRACT_PIN.
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Check out pinned contract
        run: |
          PIN=$(tr -d '[:space:]' < CONTRACT_PIN)
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid CONTRACT_PIN'; exit 1; }
          git clone --no-checkout https://github.com/lm15-dev/lm15-contract.git ../lm15-contract
          git -C ../lm15-contract checkout --detach "$PIN"
      - run: npm ci
      # macOS and Windows lock stored credentials through the native addon
      # (docs/credential-locking.md); the portable-lock tests deliberately do
      # not skip without it, so build it here, from the Node headers of the
      # running Node.
      - name: Build the native kernel-lock addon (macOS)
        if: runner.os == 'macOS'
        run: |
          V=$(node -p process.version); ARCH=$(node -p process.arch)
          curl -fsSL "https://nodejs.org/dist/$V/node-$V-headers.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cc -std=c11 -O2 -Wall -Wextra -bundle -undefined dynamic_lookup -I "$RUNNER_TEMP/node-$V/include/node" \
            native/credential_lock.c -o "native/credential_lock-darwin-$ARCH.node"
      - name: Build the native kernel-lock addon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = node -p process.version; $arch = node -p process.arch
          Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-headers.tar.gz" -OutFile "$env:RUNNER_TEMP\headers.tgz"
          tar -xzf "$env:RUNNER_TEMP\headers.tgz" -C "$env:RUNNER_TEMP"
          Invoke-WebRequest "https://nodejs.org/dist/$v/win-$arch/node.lib" -OutFile "$env:RUNNER_TEMP\node.lib"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $bat = "$env:RUNNER_TEMP\build-lock.bat"
          Set-Content $bat @(
            "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`"",
            "cl /nologo /LD /MD /std:c11 /O2 /W4 /I `"$env:RUNNER_TEMP\node-$v\include\node`" native\credential_lock.c `"$env:RUNNER_TEMP\node.lib`" /link /OUT:native\credential_lock-win32-$arch.node"
          )
          cmd /c $bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "native\credential_lock-win32-$arch.node")) { exit 1 }
      # Build first: the examples import the package by name (lm15/browser),
      # which resolves to the built dist/.
      - run: npm run build
      - name: Type-check sources, tests and examples
        run: npm run check
      - run: npm test

  contract:
    # The shared harness sandboxes the shim with Linux's `unshare -rn`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check out pinned contract
        run: |
          PIN=$(tr -d '[:space:]' < CONTRACT_PIN)
          git clone --no-checkout https://github.com/lm15-dev/lm15-contract.git ../lm15-contract
          git -C ../lm15-contract checkout --detach "$PIN"
      - run: npm ci && npm run build
      - name: Contract harness (every direction, at the pin)
        run: python3 ../lm15-contract/harness/check.py --shim typescript --direction all

  package:
    # What npm would publish, installed as a user installs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build
      - name: Pack, install in a scratch project, load every entry point
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/user" && cd "$RUNNER_TEMP/user"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/lm15-*.tgz
          test ! -e node_modules/lm15/dist/tls
          test -z "$(ls node_modules/.bin 2>/dev/null | grep lm15 || true)"
          node -e "const l = require('lm15'); if (typeof l.LMRouter !== 'function') process.exit(1)"
          node --input-type=module -e "import { LMRouter } from 'lm15'; import 'lm15/browser'; import 'lm15/testing'; if (typeof LMRouter !== 'function') process.exit(1)"
