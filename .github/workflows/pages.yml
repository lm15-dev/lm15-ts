name: Playground

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the playground
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lm15-ts
          persist-credentials: false
      - name: Read pinned source revisions
        id: sources
        working-directory: lm15-ts
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pins = JSON.parse(readFileSync('site/sources.json', 'utf8'));
          for (const key of ['python', 'rust', 'contract']) {
            if (!/^[a-f0-9]{40}$/.test(pins[key])) throw new Error(`Invalid ${key} revision`);
          }
          if (!/^\d+\.\d+\.\d+$/.test(pins.rustToolchain)) throw new Error('Invalid toolchain');
          for (const [key, value] of Object.entries(pins)) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          JS
      - name: Check out Python
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lm15-dev/lm15-python
          ref: ${{ steps.sources.outputs.python }}
          path: lm15-python
          persist-credentials: false
      - name: Check out Rust
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lm15-dev/lm15-rs
          ref: ${{ steps.sources.outputs.rust }}
          path: lm15-rs
          persist-credentials: false
      - name: Check out the contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lm15-dev/lm15-contract
          ref: ${{ steps.sources.outputs.contract }}
          path: lm15-contract
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: lm15-ts/package-lock.json
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.2'
      - name: Install the pinned Rust wasm toolchain
        env:
          TOOLCHAIN: ${{ steps.sources.outputs.rustToolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$TOOLCHAIN"
          mkdir -p "$RUNNER_TEMP/lm15-bin"
          ln -s "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/lm15-bin/wasm-ld"
          echo "$RUNNER_TEMP/lm15-bin" >> "$GITHUB_PATH"
      - name: Install locked JavaScript dependencies and a browser
        working-directory: lm15-ts
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          ln -s "$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')" "$RUNNER_TEMP/lm15-bin/chromium"
      - name: Build the pinned Python wheel
        run: |
          python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
          python -m build --no-isolation --wheel --outdir lm15-ts/vendor/python lm15-python
      - name: Build and check all public assets
        working-directory: lm15-ts
        run: |
          npm run build
          npm run check
          python tools/rust_licenses.py ../lm15-rs > vendor/rust/THIRD_PARTY_LICENSES.txt
          npm test
          node --experimental-strip-types --test tools/provider_ui.test.ts
          npm run site:package
          npm run site:test
      - name: Upload the tested site only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: lm15-ts/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
