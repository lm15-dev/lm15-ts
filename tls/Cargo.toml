[package]
name = "lm15-tls"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "TLS in the page: rustls over linear memory, so a relay carries only ciphertext (lm15-ts TunnelRelay)."

# Standalone: not a member of any workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# ring, not aws-lc-rs: ring builds for wasm32-unknown-unknown with clang.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# The target is wasm32v1-none (target_os = "none"): ring supplies SystemRandom
# there only through a custom getrandom, which here is the page's
# crypto.getRandomValues (src/lib.rs, `random`). On wasm32-unknown-unknown ring
# would require wasm-bindgen glue instead.
ring = { version = "0.17", default-features = false, features = ["less-safe-getrandom-custom-or-rdrand"] }
getrandom = { version = "0.2", features = ["custom"] }
# no_std: the module brings its own allocator.
dlmalloc = { version = "0.2", features = ["global"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
